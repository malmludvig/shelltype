name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ShellType.slnx

      - name: Build
        run: dotnet build ShellType.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ShellType.slnx --no-build -c Release --logger "console;verbosity=normal"
